name: Bug report
description: Report unexpected SDK behaviour using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private reporting](https://github.com/Ultonian/jevjavauosdk/security/advisories/new).
        Never include API keys, private request/response data or unsanitized logs in an issue.
  - type: input
    id: versions
    attributes:
      label: SDK and JDK versions
      description: Include the SDK version or commit and the JDK vendor and version.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module and environment
      description: For example jev-core, operating system and any custom transport or executor.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal sanitized reproducer
      description: Use synthetic input and include the steps or code needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
      description: Include a sanitized exception and request id only if useful; omit private bodies.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials and private request/response data.
          required: true
